version: 1
protocol: rbfe_septop
backend: local

create:
  system_name: p38
  protein_input: INPUTS/p38_protein.pdb
  ligand_input: ligand_dict.json
  ligand_ff: openff-2.3.0
  retain_lig_prot: true
  param_charge: "openff-gnn-am1bcc-1.0.0.pt"
  overwrite: false
  receptor_ff: protein.ff19SB
  solv_shell: 15.0
  water_model: OPC

run:
  output_folder: p38_septop_rbfe_48
  run_id: rep1
  max_workers: 8
  on_failure: prune
  email_on_completion: yuzhuang@stanford.edu
  slurm:
    partition: rondror,owners
    time: "4:00:00"
  max_active_jobs: 200

fe_sim:
  # 48 lambda windows
  lambdas: [0.00000000, 0.12542000, 0.16637000, 0.19653000, 0.22148000, 0.24326000,
          0.26289000, 0.28094000, 0.29779000, 0.31370000, 0.32884000, 0.34336000,
          0.35737000, 0.37095000, 0.38416000, 0.39707000, 0.40971000, 0.42215000,
          0.43441000, 0.44652000, 0.45852000, 0.47043000, 0.48228000, 0.49410000,
          0.50590000, 0.51772000, 0.52958000, 0.54150000, 0.55351000, 0.56563000,
          0.57790000, 0.59036000, 0.60303000, 0.61596000, 0.62920000, 0.64280000,
          0.65684000, 0.67140000, 0.68659000, 0.70254000, 0.71944000, 0.73754000,
          0.75722000, 0.77906000, 0.80408000, 0.83431000, 0.87533000, 1.00000000]
  eq_steps: 0
  x_n_steps: 1000000
  # non-bonded cutoff in Angstrom
  cut: 9.0
  # Monte Carlo barostat
  barostat: 2
  # use hydrogen mass repartitioning
  hmr: yes
  # 4 fs time step with HMR
  dt: 0.004
  # buffer_z for solvation layer above and below membrane
  buffer_z: 10.0
  buffer_x: 10.0
  buffer_y: 10.0
  temperature: 298.15
  # analysis excludes the first part of FE sampling
  analysis_start_step: 100000
  # MBAR analysis blocks
  blocks: 5
rbfe:
  mapping: konnektor
  konnektor_layout: redundantminimalspanningtree
  both_directions: true
  # alternatively lomap
  atom_mapper: kartograf
  kartograf:
    atom_max_distance: 0.95
    map_exact_ring_matches_only: true
    allow_partial_fused_rings: true
    allow_bond_breaks: false
